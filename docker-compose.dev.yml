version: '3.8'

services:
  website-django-dev:
    container_name: website-django-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "9798:9798"
    volumes:
      - .:/app
      - /app/website/db
    environment:
      - DJANGO_SETTINGS_MODULE=website.settings.dev
      - DEBUG=True
      - PYTHONPATH=/app
    networks:
      - website-dev-network
    # depends_on:
    #   - db-dev
    command: >
      sh -c "python website/manage.py runserver 0.0.0.0:9798 --settings=website.settings.dev"

  # # MySQL数据库
