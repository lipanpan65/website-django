version: '3.8'

services:
  website-django-debug:
    container_name: website-django-debug
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "9798:9798"  # Django 开发服务器端口
      - "5678:5678"   # debugpy 调试端口
    volumes:
      - .:/app
      - /app/website/db
    environment:
      - DJANGO_SETTINGS_MODULE=website.settings.dev
      - DEBUG=True
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    networks:
      - website-dev-network
    # depends_on:
    #   - db-debug
    command: >
      sh -c "python -m debugpy --listen 0.0.0.0:5678 --wait-for-client website/manage.py runserver 0.0.0.0:9798 --settings=website.settings.dev"

  # # MySQL数据库 - 调试环境
