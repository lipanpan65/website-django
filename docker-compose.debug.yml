version: '3.8'

services:
  website-django-debug:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
      - "5678:5678"  # 调试端口
    volumes:
      - .:/app
      - /app/website/db
    environment:
      - DJANGO_SETTINGS_MODULE=website.settings.dev
      - DEBUG=True
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    networks:
      - website-debug-network
    depends_on:
      - db-debug
    command: >
      sh -c "python -m debugpy --listen 0.0.0.0:5678 --wait-for-client website/manage.py runserver 0.0.0.0:8000"

  # MySQL数据库
  db-debug:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=website_db
      - MYSQL_USER=website_user
      - MYSQL_PASSWORD=website_password
    volumes:
      - mysql_debug_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - website-debug-network

networks:
  website-debug-network:
    driver: bridge

volumes:
  mysql_debug_data:
