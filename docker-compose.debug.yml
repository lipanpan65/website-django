  #   ports:
  #     - "3307:3306"  # 使用不同端口避免与开发环境冲突
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=rootpassword
  #     - MYSQL_DATABASE=website_db
  #     - MYSQL_USER=website_user
  #     - MYSQL_PASSWORD=website_password
  #   volumes:
  #     - mysql_debug_data:/var/lib/mysql
  #     - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  #   networks:
  #     - website-dev-network

networks:
  website-dev-network:
    external: true
    name: website-dev-network

volumes:
  mysql_debug_data:
